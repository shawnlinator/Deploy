services:
  openbao:
    build: .
    container_name: openbao
    # This host mass-restores every "unless-stopped"/"always" container the
    # instant dockerd starts, before staggered-startup.sh gets a chance to
    # pace things out — that saturated disk I/O and froze the VM once
    # already (see ~/Programs/staggered-startup.sh). on-failure means this
    # container is brought up by that script's staggered pass instead.
    restart: on-failure:5
    # Image's own ENTRYPOINT (dumb-init + entrypoint-tpm.sh) is used as-is —
    # no override here.

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # TPM/tpmrm device access via supplementary groups instead of running as
    # root or adding capabilities back — /dev/tpm0 is group "root" (0),
    # /dev/tpmrm0 is group "tss" (105 on this host; confirm with
    # `getent group tss` if rebuilding elsewhere).
    devices:
      - /dev/tpm0:/dev/tpm0
      - /dev/tpmrm0:/dev/tpmrm0
    group_add:
      - "0"
      - "105"

    # Swap: OpenBao dropped mlock support entirely (confirmed against a live
    # 2.6.2 container — it refuses to start if "disable_mlock" is set at
    # all), so there's no in-process way to keep its memory out of swap
    # anymore. Deny the container swap entirely instead of encrypting host
    # swap (swap isn't namespaced per container, so there's no way to give
    # just this container an encrypted swap volume). Matching memswap_limit
    # to mem_limit gives zero swap headroom; sizing note in Plan.md.
    mem_limit: 1g
    memswap_limit: 1g

    volumes:
      - ./config/openbao.hcl:/openbao/config/openbao.hcl:ro
      - openbao-data:/openbao/file
      - openbao-logs:/openbao/logs
      # Real seal key lives here (SoftHSM2 token store) — persistent,
      # opaque without the matching TPM-sealed PIN below.
      - softhsm-tokens:/var/lib/softhsm/tokens
      # TPM-sealed blobs wrapping the SoftHSM PIN. Safe to leave as plain
      # files on disk: useless to decrypt without this exact machine's TPM.
      - ./tpm:/etc/openbao/tpm:ro

    ports:
      # Bound to localhost only; change to "0.0.0.0:8200:8200" (and add real
      # TLS certs in config/openbao.hcl) if this needs to be reachable off-box.
      - "127.0.0.1:8200:8200"
      # Also published on this host's Tailscale IPv6 so AppRole logins can be
      # source-restricted to it via secret_id_bound_cidrs (a self-to-self
      # connection here keeps that address as the packet's source instead of
      # collapsing to a docker-bridge IP or 127.0.0.1). Not reachable off-box
      # beyond the tailnet; not a public listener.
      - "[fd7a:115c:a1e0::f401:1861]:8200:8200"

    healthcheck:
      # `bao status` exits 2 when sealed. With TPM/pkcs11 auto-unseal this
      # should self-resolve within seconds of start (entrypoint-tpm.sh
      # unseals the SoftHSM PIN from the TPM before OpenBao even starts
      # listening) rather than staying sealed until a human intervenes.
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  openbao-data:
  openbao-logs:
  softhsm-tokens:
